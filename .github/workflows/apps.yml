name: Apps bouwen

# Bouwt de Android-app (APK om zelf te testen + AAB voor de Play Store) en controleert dat de iPhone-app bouwt.
# Starten: bij elke push naar main, of met de hand via Actions → "Apps bouwen" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # om de schermafbeeldingen van de tests in een aparte branch te zetten

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Optioneel: adres van de server voor de AI-uitleg. Leeg = alleen de gratis uitleg op het toestel.
      NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEXT_PUBLIC_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: App-bestanden bouwen
        run: npm run build:app
      - name: Naar het Android-project kopiëren
        run: npx cap sync android
      - name: Sleutel voor de Play Store (alleen als die als geheim is ingesteld)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/briefhulp.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/briefhulp.jks" >> "$GITHUB_ENV"
          fi
      - name: Android bouwen (APK + AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Tot 3 keer proberen: soms geeft de downloadserver van Gradle even een fout (504)
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug bundleRelease && break; [ $i = 3 ] && exit 1; echo "Opnieuw proberen ($i)…"; sleep 20; done
      - name: APK om te testen
        uses: actions/upload-artifact@v4
        with:
          name: briefhulp-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: AAB voor de Play Store
        uses: actions/upload-artifact@v4
        with:
          name: briefhulp-android-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Emulator mogelijk maken (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testen op een Android-emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: adb install -r android/app/build/outputs/apk/debug/app-debug.apk && node tests/android-e2e.cjs
      - name: Schermafbeeldingen van de Android-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefhulp-android-test-schermen
          path: test-shots/
          retention-days: 14
      - name: Schermafbeeldingen ook in branch test-schermen-android (om te bekijken zonder downloaden)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d test-shots ] || exit 0
          cd test-shots
          git init -q -b test-schermen-android
          git config user.name "Briefhulp CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Testschermen ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-schermen-android

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App-bestanden bouwen
        run: npm run build:app
      - name: Naar het iOS-project kopiëren
        run: npx cap sync ios
      - name: iPhone-app bouwen (simulator, zonder ondertekening)
        run: |
          set -o pipefail
          # Tot 3 keer proberen (onderdelen worden van GitHub gehaald; dat gaat soms even mis)
          for i in 1 2 3; do
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40 && break
            [ $i = 3 ] && exit 1; echo "Opnieuw proberen ($i)…"; sleep 30
          done
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Testen in de iPhone-simulator (opstarten en schermafbeelding)
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" nl.briefhulp.app
          sleep 25
          mkdir -p test-shots
          xcrun simctl io "$DEV" screenshot test-shots/ios-start.png
          # De app moet nog draaien (niet gecrasht)
          xcrun simctl spawn "$DEV" launchctl list | grep -q "nl.briefhulp.app" && echo "App draait"
      - name: Schermafbeelding van de iPhone-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefhulp-ios-test-scherm
          path: test-shots/
          retention-days: 14
      - name: Schermafbeeldingen ook in branch test-schermen-ios (om te bekijken zonder downloaden)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d test-shots ] || exit 0
          cd test-shots
          git init -q -b test-schermen-ios
          git config user.name "Briefhulp CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Testschermen ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-schermen-ios
