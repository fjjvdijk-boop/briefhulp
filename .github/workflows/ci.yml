name: Controle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecontrole
        run: npm run typecheck
      - name: Testset met voorbeeldbrieven
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser voor de browsercontrole
        run: npx playwright install --with-deps chromium
      - name: Browsercontrole (toegankelijkheid, kleine schermen, alle talen, voorlezen)
        run: |
          npm start &
          for i in $(seq 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          npm run e2e
      - name: Fotoproef (schaduw, donker, scheef, wazig, klein, alles tegelijk)
        run: |
          pip install --quiet pillow numpy
          curl -sf http://localhost:3000 >/dev/null || (npm start & for i in $(seq 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done)
          python3 tests/photo/degrade.py testbrieven /tmp/fotos 01,03,05,08,12
          node tests/photo/robust.cjs /tmp/fotos
